<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SmartCapture</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <main class="min-h-screen bg-slate-950 flex justify-center">

    <div
      id="toast"
      class="pointer-events-none fixed top-6 z-50 rounded-full bg-black/80 px-5 py-3 text-center text-sm font-medium text-white shadow-lg"
      role="status"
      aria-live="polite"
    ></div>

    <!-- Tela da câmera -->
    <section
      id="camera-screen"
      class="relative min-h-screen w-full max-w-md overflow-hidden bg-black"
    >
      <video
        id="camera"
        class="absolute inset-0 h-full w-full object-cover"
        autoplay
        playsinline
      ></video>

      <canvas id="photo-canvas" class="hidden"></canvas>

      <div id="camera-grid" class="camera-grid absolute inset-0 z-10 hidden pointer-events-none"></div>
      <div id="capture-dim" class="pointer-events-none absolute inset-0 z-20 bg-black opacity-0"></div>
      <div id="focus-indicator" class="pointer-events-none absolute z-20 h-16 w-16 rounded-full border-2 border-yellow-400"></div>

      <!-- Controles superiores -->
      <header class="absolute left-0 top-0 z-30 w-full bg-gradient-to-b from-black/70 to-transparent p-5">
        <nav class="flex items-center justify-between text-white">
          <button id="settings-button" type="button" class="camera-control" aria-label="Configurações">
            ⚙
          </button>

          <button id="flash-button" type="button" class="camera-control" aria-label="Flash">
            ⚡
          </button>

          <button id="timer-button" type="button" class="camera-control text-sm" aria-label="Temporizador">
            0s
          </button>

          <button id="ratio-button" type="button" class="camera-control text-sm" aria-label="Proporção da câmera">
            4:3
          </button>
        </nav>
      </header>

      <div
        id="countdown"
        class="pointer-events-none absolute inset-0 z-30 hidden items-center justify-center bg-black/30 text-8xl font-bold text-white"
      ></div>

      <!-- Controles inferiores -->
      <footer class="absolute bottom-0 left-0 z-30 w-full bg-gradient-to-t from-black via-black/80 to-transparent px-6 pb-8 pt-16 text-white">
        <h1 class="mb-8 text-center text-xl font-semibold text-yellow-400">
          SmartCapture
        </h1>

        <div class="flex items-center justify-between">
          <button
            id="open-image-picker"
            type="button"
            class="flex min-w-16 flex-col items-center gap-1 text-sm"
          >
            <span class="rounded-md border border-white/50 px-2 py-1 text-lg">▣</span>
            Galeria
          </button>

          <input id="image-picker" type="file" accept="image/*" class="hidden">

          <button
            id="capture-button"
            type="button"
            aria-label="Tirar foto"
            class="capture-button flex h-20 w-20 items-center justify-center rounded-full border-4 border-white"
          >
            <span class="h-14 w-14 rounded-full border-2 border-yellow-400"></span>
          </button>

          <button
            id="switch-camera-button"
            type="button"
            class="flex min-w-16 flex-col items-center gap-1 text-sm"
            aria-label="Trocar câmera"
          >
            <span class="rounded-md border border-white/50 px-2 py-1 text-lg">↻</span>
            Virar
          </button>
        </div>
      </footer>
    </section>

    <!-- Tela de prévia -->
    <section
      id="preview-screen"
      class="relative hidden min-h-screen w-full max-w-md items-center justify-center overflow-hidden bg-black text-white"
    >
      <img
        id="preview-background"
        class="absolute inset-0 h-full w-full scale-110 object-cover opacity-35 blur-xl"
        alt=""
      >

      <div class="absolute inset-0 bg-black/50"></div>

      <button
        id="share-button"
        type="button"
        class="absolute top-16 z-10 flex flex-col items-center gap-1 font-semibold"
      >
        <span class="text-3xl leading-none">⌃</span>
        Compartilhar
      </button>

      <img
        id="captured-photo"
        draggable="false"
        class="relative z-10 h-[72vh] w-[78%] cursor-grab rounded-2xl object-cover shadow-2xl touch-none"
        alt="Foto capturada"
      >

      <button
        id="delete-photo"
        type="button"
        class="absolute left-5 z-10 font-semibold [writing-mode:vertical-rl]"
      >
        ‹ Excluir
      </button>

      <button
        id="store-button"
        type="button"
        class="absolute right-5 z-10 font-semibold [writing-mode:vertical-rl]"
      >
        Armazenar ›
      </button>

      <p class="absolute bottom-16 z-10 px-8 text-center text-lg font-semibold">
        Arraste a foto para guardar, compartilhar ou excluir
      </p>
    </section>

    <!-- Tela de compartilhamento -->
    <section
      id="share-screen"
      class="relative hidden min-h-screen w-full max-w-md items-center justify-center overflow-hidden bg-black text-white"
    >
      <img
        id="share-background"
        class="absolute inset-0 h-full w-full scale-110 object-cover opacity-30 blur-xl"
        alt=""
      >

      <div class="absolute inset-0 bg-black/60"></div>

      <header class="absolute top-0 z-30 flex w-full items-center justify-between p-6">
        <button
          id="back-to-preview-button"
          type="button"
          class="rounded-full bg-black/60 px-4 py-2 font-medium"
        >
          ← Voltar
        </button>

        <h2 class="text-xl font-semibold">Compartilhar</h2>

        <span class="w-20"></span>
      </header>

      <img
        id="share-photo"
        class="relative z-10 h-[62vh] w-[78%] rounded-2xl object-cover shadow-2xl"
        alt="Foto pronta para compartilhamento"
      >

      <footer class="absolute bottom-0 z-30 w-full bg-black p-6">
        <p class="mb-4 text-center text-sm text-slate-300">
          Opções de compartilhamento
        </p>

        <div class="flex justify-between gap-3">
          <button
            type="button"
            class="social-share-button flex h-16 w-16 items-center justify-center rounded-2xl bg-green-500 text-3xl font-bold"
            data-network="WhatsApp"
            aria-label="Compartilhar pelo WhatsApp"
          >
            W
          </button>

          <button
            type="button"
            class="social-share-button flex h-16 w-16 items-center justify-center rounded-2xl bg-gradient-to-br from-yellow-400 via-pink-500 to-purple-600 text-3xl"
            data-network="Instagram"
            aria-label="Compartilhar pelo Instagram"
          >
            ◎
          </button>

          <button
            type="button"
            class="social-share-button flex h-16 w-16 items-center justify-center rounded-2xl bg-sky-500 text-3xl"
            data-network="Telegram"
            aria-label="Compartilhar pelo Telegram"
          >
            ✈
          </button>

          <button
            type="button"
            class="social-share-button flex h-16 w-16 items-center justify-center rounded-2xl bg-blue-600 text-4xl font-bold"
            data-network="Facebook"
            aria-label="Compartilhar pelo Facebook"
          >
            f
          </button>
        </div>

      </footer>
    </section>

    <!-- Configurações -->
    <section
      id="settings-panel"
      class="absolute inset-0 z-50 hidden min-h-screen w-full max-w-md bg-slate-950/95 p-6 text-white backdrop-blur-md"
    >
      <header class="mb-10 flex items-center justify-between">
        <h2 class="text-2xl font-semibold">Configurações</h2>

        <button
          id="close-settings-button"
          type="button"
          class="rounded-full bg-white/10 px-4 py-2"
        >
          ✕
        </button>
      </header>

      <div class="space-y-4">
        <label class="flex cursor-pointer items-center justify-between rounded-2xl bg-white/10 p-5">
          <span>
            <strong class="block">Grade da câmera</strong>
            <small class="text-slate-300">Ajuda no enquadramento.</small>
          </span>

          <input id="grid-toggle" type="checkbox" class="h-5 w-5 accent-yellow-400">
        </label>

        <div class="rounded-2xl bg-white/10 p-5">
          <strong class="block">Foco por toque</strong>
          <small class="text-slate-300">
            Toque na imagem para marcar o ponto de foco.
          </small>
        </div>

        <div class="rounded-2xl bg-white/10 p-5">
          <strong class="block">Flash</strong>
          <small class="text-slate-300">
            Funciona apenas em aparelhos compatíveis.
          </small>
        </div>
      </div>
    </section>

  </main>

  <script src="js/script.js"></script>
</body>
</html>
